services:
  mysql:
    image: mysql:8.4
    container_name: cloudissue-mysql
    restart: unless-stopped
    # 口令一律取自 .env，禁止在编排文件里写死（.env.example 有模板）
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-issue_board}
      MYSQL_USER: ${DB_USER:-issue}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
    ports:
      - '${MYSQL_PUBLISH:-127.0.0.1:3306}:3306' # 默认仅绑定本机回环；需外部直连时改 .env
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: cloudissue-app
    restart: unless-stopped
    env_file: .env
    environment:
      # 容器网络内固定连 mysql 服务；.env 里的 DB_HOST 被这里覆盖
      DB_HOST: mysql
      DB_PORT: '3306'
    ports:
      - '${PORT:-5173}:5173'
    depends_on:
      mysql:
        condition: service_healthy

  # 备份服务：定时 mysqldump 到 backups 卷（默认不启动，随 tools profile 拉起）
  #   docker compose --profile tools up -d backup
  # 间隔 BACKUP_INTERVAL 秒（默认 6h）；保留 KEEP_BACKUPS 份；也可手动触发：
  #   docker compose --profile tools run --rm backup /scripts/backup.sh
  backup:
    image: mysql:8.4
    container_name: cloudissue-backup
    profiles: ['tools']
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: '3306'
      BACKUP_DIR: /backups
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-21600}
      KEEP_BACKUPS: ${KEEP_BACKUPS:-14}
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ./backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        chmod +x /scripts/backup.sh 2>/dev/null || true
        echo "[backup] 定时备份已启动：每 $$BACKUP_INTERVAL 秒，保留 $$KEEP_BACKUPS 份"
        while true; do
          /scripts/backup.sh || echo "[backup] 本次备份失败，等待下个周期"
          sleep "$$BACKUP_INTERVAL"
        done

volumes:
  mysql-data:
