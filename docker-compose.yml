services:
  mysql:
    image: mysql:8.4
    container_name: cloudissue-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: issue_board
      MYSQL_USER: issue
      MYSQL_PASSWORD: issue_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
