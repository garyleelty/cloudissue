name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: issue_board
          MYSQL_USER: issue
          MYSQL_PASSWORD: issue_pass
          MYSQL_ROOT_PASSWORD: ci_root_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_pass"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: issue
      DB_PASSWORD: issue_pass
      DB_NAME: issue_board
      JWT_SECRET: ci-only-secret-not-for-production-use
      # 认证套件会发起大量登录尝试
      AUTH_RATE_LIMIT: '10000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: 前端冒烟（jsdom，离线）
        run: npm run test:ui

      # 失败时把测试输出打成 ::error:: 注解（无需登录即可通过 API 排查）
      - name: MCP 链路冒烟（离线）
        run: |
          set -o pipefail
          npm run test:mcp 2>&1 | tee /tmp/mcp.log || {
            grep -E "FAIL|缺少|Error|error" /tmp/mcp.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: 集成测试（HTTP → MCP → MySQL 全链路）
        run: |
          node server/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/api/health >/dev/null && break
            sleep 1
          done
          set -o pipefail
          npm test 2>&1 | tee /tmp/integration.log || {
            grep -E "FAIL|测试异常" /tmp/integration.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            tail -30 server.log >&2
            exit 1
          }

      - name: 输出服务日志（仅失败时）
        if: failure()
        run: cat server.log

  # 备份可恢复性验证：每次 push 都证明「备份 → 全新实例恢复 → 行数/一致性」走得通
  backup-restore:
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: issue_board
      # 恢复验证用模式一：复用运行中的 MySQL 实例，独立 database 隔离
      VERIFY_HOST: 127.0.0.1
      VERIFY_PORT: '3306'
      VERIFY_USER: root
      VERIFY_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MySQL 8.4（runner 本机 mysqld 实例）
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: '8.4'
          auto-start: true
          root-password: root

      - name: 建库并初始化结构（经服务端 board_bootstrap）
        env:
          JWT_SECRET: ci-only-secret-not-for-production-use
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS issue_board CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER IF NOT EXISTS 'issue'@'%' IDENTIFIED BY 'issue_pass'; GRANT ALL ON issue_board.* TO 'issue'@'%';"
          npm ci --ignore-scripts
          node server/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5173/api/health || { cat server.log >&2; exit 1; }
          kill %1 2>/dev/null || true

      - name: 备份
        run: |
          set -o pipefail
          sh scripts/backup.sh 2>&1 | tee /tmp/backup.log || {
            grep -iE "错误|error|unknown|denied|failed" /tmp/backup.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          ls -la backups/
          echo "--- dump 头部（前 15 行）---"
          gzip -dc backups/cloudissue-*.sql.gz | head -15 || true

      - name: 恢复验证（临时实例导入 + manifest 比对 + 孤儿检查）
        run: |
          set -o pipefail
          sh scripts/restore-verify.sh backups/cloudissue-*.sql.gz 2>&1 | tee /tmp/verify.log || {
            grep -E "FAIL|错误|Error" /tmp/verify.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: 输出备份日志（仅失败时，全量转注解便于离线排障）
        if: failure()
        run: |
          tail -40 /tmp/backup.log 2>/dev/null | while IFS= read -r l; do
            echo "::warning::$l"
          done
          echo "--- verify 日志 ---"
          tail -60 /tmp/verify.log 2>/dev/null | while IFS= read -r l; do
            echo "::warning::verify: $l"
          done

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（验证 Dockerfile 可用）
        run: docker build -t cloudissue:ci .
